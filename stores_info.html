<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Stores</title>
  <link rel="stylesheet" href="style.css?v=16">
</head>
<body class="stores_info">
  <div class="tt" style="box-shadow:none;">
    <div>
      <a href="index.html" class="a">
        <h1 class="title">— Finding Foods —</h1>
      </a>
    <div class="btn-row">
      <button id="backBtn" class="btn1">Return To Homepage</button>
      <button id="downloadBtn" class="btn1">Download Shops Info (.json)</button>
    </div>

    <form style="margin-top:16px;">
      <label class="label">
        <input type="radio" name="category" value="all" checked/>
        <span>All</span>
      </label>
      <label class="label">
        <input type="radio" name="category" value="food"/>
        <span>Food</span>
      </label>
      <label class="label">
        <input type="radio" name="category" value="drink"/>
        <span>Drink</span>
      </label>
      <label class="label">
        <input type="radio" name="category" value="snack"/>
        <span>Snack</span>
      </label>
      <label class="label">
        <input type="radio" name="category" value="other"/>
        <span>Other</span>
      </label>
    </form>
    <div class="search-box">
      <select id="sortSelect">
        <option value="default">Default</option>
        <option value="name-asc">Name A -> Z</option>
        <option value="name-desc">Name Z -> A</option>
        <option value="category">Category</option>
      </select>
      <input
        type="search"
        id="searchInput"
        placeholder="Search Store Name..."
        autocomplete="off"
      />
    </div>
  </div>
  
  <table id="storeTable" class="table">
    <thead>
      <tr>
        <th class="th">Category</th>
        <th class="th">Name</th>
        <th class="th">Link</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <div class="pagination">
    <button id="firstBtn">First</button>
    <button id="prevBtn">Prev</button>
    <span id="pageInfo"></span>
    <button id="nextBtn">Next</button>
    <button id="lastBtn">Last</button>
  </div>
  <div class="bottom">
    <label id="total" class="LittleFont">Current total number of stores: 0</label>
    <label class="LittleFont">/</label>
    <label id="update-time" class="LittleFont">Last update: loading...</label>
  </div>
  <button id="toTopBtn" class="to-top">Top</button>
  
  <script src="stores_info.js"></script>
  <script src="scroll.js"></script>
</body>
</html>
