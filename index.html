<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>finding foods system</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div>
    <h1 class="title">Finding Foods</h1>
  </div>
  <div class="tt">
    <label>
      <h2>What do u want to eat today?</h2>
      <h3 class="LittleFont">Just wiggle ur finger and I'll decide for u.</h3>
    </label><br>
    
    <label><input type="radio" name="category" value="all" checked>All</label>
    <label><input type="radio" name="category" value="food">Food</label>
    <label><input type="radio" name="category" value="drink">Drink</label>
    <label><input type="radio" name="category" value="snack">Snack</label>
    <label><input type="radio" name="category" value="other">Other</label>
    
    <button id="StartBtn" class="btn">start</button>
  </div>
    
  <div class="bottom">
    <label id="total" class="LittleFont">Current total number of stores: 0</label>
  </div>

  <script src="main.js"></script>
</body>
</html>
