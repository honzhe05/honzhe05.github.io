<html lang="zh-Hant">
<head>

  <meta charset="UTF-8">
  <meta name="description" content="Today's tools to help u choose what to eat.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>finding foods system</title>
  <link rel="stylesheet" href="style.css?v=21">
</head>
<body id="index">
  <div>
    <a href="index.html" class="a">
      <h1 class="title">— Finding Foods —</h1>
    </a>
  </div>
  <div class="main">
    <div class="left">
      <div class="tt">
        <h2>What do u want to eat today?
          <br>
          <i>-Just wiggle ur finger and I'll decide for u-</i>
        </h2><br>
        
        <form>
          <label class="label">
            <input type="radio" name="category" value="all" checked/>
            <span>All</span>
          </label>
        
          <label class="label">
            <input type="radio" name="category" value="food"/>
            <span>Food</span>
          </label>
          <label class="label">
            <input type="radio" name="category" value="drink"/>
            <span>Drink</span>
          </label>
          <label class="label">
            <input type="radio" name="category" value="snack"/>
            <span>Snack</span>
          </label>
          <label class="label">
            <input type="radio" name="category" value="other"/>
            <span>Other</span>
          </label>
        </form>
        
        <button id="StartBtn" class="btn">Start Drawing</button>
      </div>
    
      <div class="btn-row" style="margin-top:15px;">
        <button id="toInfoBtn" class="btn1">Display Shops Info</button>
        <button id="githubBtn" class="btn1"> Go to This Github Website </button>
      </div>
      
      <div class="bottom">
        <label id="total" class="LittleFont">Current total number of stores: 0</label>
        <label class="LittleFont">/</label>
        <label id="update-time" class="LittleFont">Last update: loading...</label>
      </div>
      
      <div id="bottom1" class="bottom1">
        <label id="choose" class="LittleFont">Today u've already struggled to decide 0 time. zzz</label>
      </div>
    </div>
  
    <div class="right">
      <div id="spinner" class="spinner" style="display:none;"></div>
      <div id="result" style="margin-top:20px;"></div>
    </div>
  </div>
  
  <script src="main.js"></script>
</body>
</html>
