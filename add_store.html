<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Stores</title>
  
  <link rel="stylesheet" href="css/style.css?v=50">
  <link rel="stylesheet" href="css/media.css?v=50">
  <link rel="stylesheet" href="css/table.css?v=50">
</head>
<body>
  <div class="tt">
    <a href="index.html" class="a">
      <h2 style="text-align: center;">Add New Store</h2>
    </a>
    <div class="search-box">
      <input id="username" placeholder="admin">
      <input id="password" placeholder="password" type="password">
    </div>
    <form style="margin-top:12px;">
      <label class="label">
        <input type="radio" name="stepType" value="add" checked/>
        <span>Add store</span>
      </label>
      <label class="label">
        <input type="radio" name="stepType" value="remove"/>
          <span>Remove store</span>
      </label>
    </form>
    
    <div id="addStore">
      <div class="search-box">
        <input id="storeName" placeholder="Store Name">
        <select id="storeCategory">
          <option value="food">food</option>
          <option value="drink">drink</option>
          <option value="snack">snack</option>
          <option value="other">other</option>
        </select>
        <button id="addStoreBtn">Add Store</button>
      </div>
    </div>
    <div id="removeStore" style="display:none;">
      <div class="search-box">
        <input id="storeId" placeholder="Store ID">
        <button id="removeStoreBtn">Remove Store</button>
      </div>
    </div>
  </div>

  <script src="js/add_store.js"></script>
</body>
</html>
