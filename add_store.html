<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Stores</title>
  
  <link rel="stylesheet" href="css/style.css?v=50">
  <link rel="stylesheet" href="css/media.css?v=50">
  <link rel="stylesheet" href="css/table.css?v=50">
</head>
<body>
  <div class="tt">
    <a href="index.html" class="a">
      <h2 style="text-align: center;">Add New Store</h2>
    </a>
    <div class="search-box">
      <input id="username" placeholder="admin" required>
      <input id="password" placeholder="password" type="password" required>
    </div>
    <form style="margin-top:12px;">
      <label class="label">
        <input type="radio" name="stepType" value="add" checked/>
        <span>Add store</span>
      </label>
      <label class="label">
        <input type="radio" name="stepType" value="remove"/>
          <span>Remove store</span>
      </label>
    </form>
    <form id="addStoreForm">
      <div class="search-box">
        <input id="storeName" placeholder="Store Name" required>
        <select id="storeCategory" required>
          <option value="food">food</option>
          <option value="drink">drink</option>
          <option value="snack">snack</option>
          <option value="other">other</option>
        </select>
        <button type="submit">Add Store</button>
      </div>
    </form>
    <form id="removeStoreForm" style="display:none;">
      <div class="search-box">
        <input id="storeId" placeholder="Store ID" required type="number">
        <button type="submit">Remove Store</button>
      </div>
    </form>
    
    <table id="storeTable" class="table">
      <thead>
        <tr>
          <th class="th">Id</th>
          <th class="th">Name</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="js/add_store.js"></script>
</body>
</html>
