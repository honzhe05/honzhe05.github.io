<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Stores</title>
  
  <link rel="stylesheet" href="css/style.css?v=50">
  <link rel="stylesheet" href="css/media.css?v=50">
  <link rel="stylesheet" href="css/table.css?v=50">
</head>
<body>
  <div class="tt">
    <h2 style="text-align: center;">Add New Store</h2>
    <div class="search-box">
      <input id="username" placeholder="admin">
      <input id="password" placeholder="password" type="password">
    </div>
    <div class="search-box">
    <input id="storeName" placeholder="Store Name">
    <input id="storeMap" placeholder="Google Maps URL">
    </div>
    <div class="search-box">
    <select id="storeCategory">
      <option value="food">food</option>
      <option value="drink">drink</option>
      <option value="snack">snack</option>
      <option value="other">other</option>
    </select>
    <button id="addStoreBtn">Add Store</button>
    </div>
  </div>

  <script src="js/add_store.js"></script>
</body>
</html>
